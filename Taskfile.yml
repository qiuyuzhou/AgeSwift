# AgeSwift task runner — https://taskfile.dev
#
# Day-to-day development:
#   task build        build the Rust FFI XCFramework
#   task test         run the full Rust + Swift test suite
#
# Releasing (one local command; see README "Releasing (maintainers)"):
#   task release VERSION=x.y.z
#   task verify-release VERSION=x.y.z   verify downstream resolution after a release
version: '3'

vars:
  ARTIFACT_DIR: Artifacts
  XCFRAMEWORK: AgeSwiftFFI.xcframework
  ZIP: Artifacts/AgeSwiftFFI.xcframework.zip
  CHECKSUM_FILE: Artifacts/AgeSwiftFFI.xcframework.zip.checksum
  REPO: qiuyuzhou/AgeSwift
  REMOTE: origin
  BRANCH: main

tasks:
  default:
    desc: List all tasks
    cmds:
      - task --list

  build:
    desc: Build the XCFramework from the Rust sources (release profile)
    cmds:
      - ./Scripts/build-xcframework.sh

  test:
    desc: Run the Rust tests and swift test
    deps: [build]
    cmds:
      - cargo test --manifest-path Rust/age-swift-ffi/Cargo.toml
      - swift test

  # ---- internal tasks below: release orchestration steps only, hidden from --list ----

  preflight:
    internal: true
    desc: Pre-release checks (internal step)
    requires:
      vars: [VERSION]
    cmds:
      - |
        set -euo pipefail
        [[ "{{.VERSION}}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
          || { echo "VERSION must be x.y.z, got: {{.VERSION}}"; exit 1; }
        test -z "$(git status --porcelain)" \
          || { echo "worktree is dirty, commit or stash first"; exit 1; }
        test "$(git branch --show-current)" = "{{.BRANCH}}" \
          || { echo "releases must be cut from {{.BRANCH}}"; exit 1; }
        git fetch {{.REMOTE}} {{.BRANCH}}
        test "$(git rev-parse HEAD)" = "$(git rev-parse {{.REMOTE}}/{{.BRANCH}})" \
          || { echo "local HEAD and origin/{{.BRANCH}} differ (ahead or behind), pull/push first"; exit 1; }
        if git rev-parse -q --verify "refs/tags/{{.VERSION}}" >/dev/null; then
          echo "tag {{.VERSION}} already exists locally"; exit 1
        fi
        if git ls-remote --exit-code --tags {{.REMOTE}} "refs/tags/{{.VERSION}}" >/dev/null; then
          echo "tag {{.VERSION}} already exists on {{.REMOTE}}"; exit 1
        fi
        command -v gh >/dev/null \
          || { echo "GitHub CLI required (brew install gh)"; exit 1; }
        gh auth status >/dev/null 2>&1 \
          || { echo "gh is not logged in, run gh auth login first"; exit 1; }
        echo "preflight OK: {{.VERSION}}"

  dist:
    internal: true
    desc: Zip the XCFramework and compute the SPM checksum (internal step)
    deps: [build]
    cmds:
      - rm -f {{.ZIP}} {{.CHECKSUM_FILE}}
      - cd {{.ARTIFACT_DIR}} && zip -qry {{.XCFRAMEWORK}}.zip {{.XCFRAMEWORK}}
      - swift package compute-checksum {{.ZIP}} | tee {{.CHECKSUM_FILE}}

  manifest:
    internal: true
    desc: Write the release URL and checksum into Package.swift (internal step)
    requires:
      vars: [VERSION]
    cmds:
      - |
        set -euo pipefail
        CHECKSUM="$(cat {{.CHECKSUM_FILE}})"
        URL="https://github.com/{{.REPO}}/releases/download/{{.VERSION}}/{{.XCFRAMEWORK}}.zip"
        # Guard against anything unexpected (e.g. extra stdout lines) polluting the value
        [[ "$CHECKSUM" =~ ^[0-9a-f]{64}$ ]] \
          || { echo "unexpected checksum value: '$CHECKSUM'"; exit 1; }
        # Whole-line rewrite (anchored on the `let` prefix): no capture groups,
        # no escaping ambiguity — values are checksums/URLs without | or &.
        sed \
          -e "s|^let releasedBinaryURL = .*|let releasedBinaryURL = \"$URL\"|" \
          -e "s|^let releasedBinaryChecksum = .*|let releasedBinaryChecksum = \"$CHECKSUM\"|" \
          Package.swift > Package.swift.tmp
        mv Package.swift.tmp Package.swift
        # Verify the substitutions actually happened (fails here if the manifest shape drifts)
        grep -F "let releasedBinaryURL = \"$URL\"" Package.swift
        grep -F "let releasedBinaryChecksum = \"$CHECKSUM\"" Package.swift

  tag:
    internal: true
    desc: Commit the manifest change and create the annotated tag (internal step)
    requires:
      vars: [VERSION]
    cmds:
      - git add Package.swift
      - |
        if git diff --cached --quiet -- Package.swift; then
          echo "Package.swift unchanged, aborting"; exit 1
        fi
      - git commit -m "Release {{.VERSION}}"
      - git tag -a {{.VERSION}} -m "AgeSwift {{.VERSION}}"

  publish:
    internal: true
    desc: Push and create the GitHub Release with the same zip (internal step)
    requires:
      vars: [VERSION]
    cmds:
      - git push {{.REMOTE}} {{.BRANCH}} refs/tags/{{.VERSION}}
      - gh release create {{.VERSION}} {{.ZIP}} \
          --verify-tag --title {{.VERSION}} --generate-notes
      - 'echo "released {{.VERSION}}: https://github.com/{{.REPO}}/releases/tag/{{.VERSION}}"'

  # ---- public entry points ----

  release:
    desc: "Release a new version (usage: task release VERSION=x.y.z)"
    requires:
      vars: [VERSION]
    cmds:
      - task: preflight
      - task: test
      - task: dist
      - task: manifest
      - task: tag
      - task: publish
      - |
        echo ""
        echo "Released {{.VERSION}}. Recommended: run the end-to-end check"
        echo "  task verify-release VERSION={{.VERSION}}"

  verify-release:
    desc: "Verify the new version resolves and builds in a scratch package (usage: task verify-release VERSION=x.y.z)"
    requires:
      vars: [VERSION]
    cmds:
      - |
        set -euo pipefail
        TMP="$(mktemp -d)"
        trap 'rm -rf "$TMP"' EXIT
        cd "$TMP"
        mkdir -p Sources/Smoke
        touch Sources/Smoke/Smoke.swift
        cat > Package.swift <<EOF
        // swift-tools-version: 6.0
        import PackageDescription
        let package = Package(
            name: "Smoke",
            platforms: [.macOS(.v13)],
            dependencies: [
                .package(url: "https://github.com/{{.REPO}}.git", from: "{{.VERSION}}"),
            ],
            targets: [
                .target(name: "Smoke", dependencies: [.product(name: "AgeSwift", package: "AgeSwift")]),
            ]
        )
        EOF
        swift package resolve
        swift build
        echo "verify-release OK: {{.VERSION}} resolves and builds downstream"
